<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trustpilot Scout</title>
    <meta name="description" content="Listez les entreprises Trustpilot par recherche ou par secteur, et fouillez leurs avis." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%235165f7'/%3E%3Ctext x='50' y='70' font-size='62' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='%23fff'%3ES%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-in">
        <a class="brand" href="/">
          <span class="brand-mark">S</span>
          <span class="brand-name">Trustpilot Scout</span>
        </a>
        <span class="tag status" id="status">
          <span class="dot" id="status-dot"></span>
          <span id="status-text">Vérification…</span>
        </span>
      </div>
    </header>

    <main class="shell">
      <h1 class="title">Quelles entreprises cibler aujourd’hui&#8239;?</h1>

      <form class="panel filters" id="filters" autocomplete="off">
        <div class="segmented" role="tablist" aria-label="Mode de recherche">
          <button type="button" class="mode" data-mode="business" role="tab" aria-selected="true">Entreprises</button>
          <button type="button" class="mode" data-mode="category" role="tab" aria-selected="false">Par secteur</button>
          <button type="button" class="mode" data-mode="company" role="tab" aria-selected="false">Avis d’une entreprise</button>
          <button type="button" class="mode" data-mode="reviews" role="tab" aria-selected="false">
            Dans les avis
            <span class="tag tag-primary mode-badge">Beta</span>
          </button>
        </div>

        <div class="search-row">
          <div class="field grow" data-modes="business company reviews">
            <label class="label" for="q" id="q-label">Recherche</label>
            <input id="q" name="q" type="search" placeholder="ex. boutique en ligne, vpn, streaming, amazon…"
                   maxlength="300" />
          </div>
          <div class="field grow" data-modes="category" hidden>
            <label class="label" for="category">Secteur</label>
            <select id="category" name="category">
              <option value="">Choisir un secteur</option>
            </select>
          </div>
          <button class="btn btn-lg" id="submit" type="submit">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.4-3.4"/></svg>
            <span>Chercher</span>
          </button>
        </div>

        <div class="filter-grid">
          <div class="field" data-modes="company" hidden>
            <label class="label" for="term">Dans le texte</label>
            <input id="term" name="term" type="text" placeholder="mot ou phrase (facultatif)" maxlength="80" />
          </div>
          <div class="field" data-modes="category" hidden>
            <label class="label" for="country">Pays</label>
            <select id="country" name="country"></select>
          </div>
          <div class="field" data-modes="business category reviews">
            <label class="label" for="stars">Note minimale</label>
            <select id="stars" name="stars"></select>
          </div>
          <div class="field" data-modes="business reviews">
            <label class="label" for="reviews">Nombre d’avis</label>
            <select id="reviews" name="reviews"></select>
          </div>
          <div class="field" data-modes="business category reviews">
            <label class="label" for="location" id="location-label">Localisation</label>
            <input id="location" name="location" type="text" placeholder="pays ou ville (ex. France)" maxlength="80" />
          </div>
          <div class="field" data-modes="category" hidden>
            <label class="label" for="sort">Tri</label>
            <select id="sort" name="sort"></select>
          </div>
          <div class="field" data-modes="company" hidden>
            <label class="label" for="rating">Note de l’avis</label>
            <select id="rating" name="rating"></select>
          </div>
          <div class="field" data-modes="company" hidden>
            <label class="label" for="lang">Langue</label>
            <select id="lang" name="lang"></select>
          </div>
          <div class="field" data-modes="company" hidden>
            <label class="label" for="rsort">Tri</label>
            <select id="rsort" name="rsort"></select>
          </div>
          <button class="btn btn-outline btn-lg" id="export" type="button" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
            Exporter la page
          </button>
        </div>

        <p class="hint" id="hint"></p>
      </form>

      <div class="results-head" id="results-head" hidden>
        <h2><span id="count">0</span> <span id="count-label">entreprise(s) trouvée(s)</span></h2>
        <span class="meta" id="meta"></span>
      </div>

      <div id="results" aria-live="polite"></div>

      <p class="footnote">
        Données publiques Trustpilot, récupérées à la demande et mises en cache quelques minutes.
      </p>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
