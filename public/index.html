<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trustpilot Scout</title>
    <meta name="description" content="Listez les entreprises Trustpilot par recherche ou par secteur, et fouillez leurs avis." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%235165f7'/%3E%3Ctext x='50' y='70' font-size='62' font-family='sans-serif' font-weight='bold' text-anchor='middle' fill='%23fff'%3ES%3C/text%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-in">
        <a class="brand" href="/">
          <span class="brand-mark">S</span>
          <span class="brand-name">Trustpilot Scout</span>
        </a>
      </div>
    </header>

    <main class="shell">
      <h1 class="title">Quelles entreprises cibler aujourd’hui&#8239;?</h1>

      <form class="panel filters" id="filters" autocomplete="off">
        <div class="search-row">
          <div class="field grow">
            <label class="label" for="q">Entreprise</label>
            <input id="q" name="q" type="search" placeholder="nom, mot-clé ou domaine" maxlength="300" />
          </div>
          <div class="field grow">
            <label class="label" for="category-input">Secteur</label>
            <div class="combo">
              <input id="category-input" type="text" role="combobox" placeholder="Tous les secteurs" aria-autocomplete="list" aria-expanded="false" aria-controls="category-list" />
              <input id="category" name="category" type="hidden" />
              <ul class="combo-list" id="category-list" role="listbox" hidden></ul>
            </div>
          </div>
          <div class="field grow">
            <label class="label" for="term">Dans les avis</label>
            <input id="term" name="term" type="search" placeholder="mot ou phrase" maxlength="80" />
          </div>
        </div>

        <details class="advanced" id="advanced">
          <summary>Options avancées <span class="advanced-count" id="advanced-count"></span></summary>
          <div class="filter-grid">
            <div class="field">
              <label class="label" for="country">Pays</label>
              <select id="country" name="country">
                <option value="">Tous les pays</option>
              </select>
            </div>
            <div class="field">
              <label class="label" for="city">Ville</label>
              <input id="city" name="city" type="text" placeholder="ex. Lyon" maxlength="80" />
            </div>
            <div class="field">
              <label class="label" for="stars">Note de l’entreprise</label>
              <select id="stars" name="stars"></select>
            </div>
            <div class="field">
              <label class="label" for="reviews">Nombre d’avis</label>
              <select id="reviews" name="reviews"></select>
            </div>
            <div class="field">
              <label class="label" for="rating">Note de l’avis</label>
              <select id="rating" name="rating"></select>
            </div>
            <div class="field">
              <label class="label" for="lang">Langue des avis</label>
              <select id="lang" name="lang"></select>
            </div>
            <div class="field">
              <label class="label" for="sort">Tri</label>
              <select id="sort" name="sort"></select>
            </div>
          </div>
        </details>

        <div class="form-foot">
          <p class="hint" id="hint" aria-live="polite"></p>
          <button class="btn btn-lg" id="submit" type="submit">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.4-3.4"/></svg>
            <span>Chercher</span>
          </button>
        </div>
      </form>

      <div class="results-head" id="results-head" hidden>
        <h2><span id="count">0</span> <span id="count-label">entreprise(s) trouvée(s)</span></h2>
        <div class="results-tools">
          <span class="meta" id="meta"></span>
          <button class="btn btn-outline btn-sm" id="export" type="button" disabled>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
            Exporter
          </button>
        </div>
      </div>

      <div id="results" aria-live="polite"></div>

      <p class="footnote">
        Données publiques Trustpilot, récupérées à la demande et mises en cache quelques minutes.
      </p>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
